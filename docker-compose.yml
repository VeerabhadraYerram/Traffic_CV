services:
  # UC4 ANPR Stream Analytics Worker (Approach 2 Integration)
  uc4_anpr:
    build:
      context: .
      dockerfile: Dockerfile
    image: innovision/uc4-anpr:latest
    container_name: innovision_uc4_anpr
    restart: unless-stopped
    command: python worker.py
    env_file:
      - .env
    ports:
      - "8004:8004"  # Non-blocking health & dynamic config API
    shm_size: "4gb"
    volumes:
      - ./:/app
      - ./.paddleocr:/root/.paddleocr
      - ./models:/app/models
      - ./snapshots:/app/snapshots
    networks:
      - innovision_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional local services for development/testing (when platform stack is not active)
  local_redis:
    image: redis:7-alpine
    container_name: uc4_local_redis
    ports:
      - "6379:6379"
    networks:
      - innovision_network
    profiles:
      - dev

  local_db:
    image: postgres:15-alpine
    container_name: uc4_local_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: uc4_anpr
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - innovision_network
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  innovision_network:
    name: innovision_network
    driver: bridge
    attachable: true
