services:
  db:
    image: postgres:15-alpine
    container_name: traffic_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: traffic
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"

  app:
    build: .
    container_name: traffic_pipeline
    command: uvicorn pipeline_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/traffic
      - PYTHONUNBUFFERED=1
    shm_size: '4gb'
    volumes:
      # Map the local codebase for instant code reloads
      - ./:/app
      # Universal video data mapping
      - ./data/downloads:/app/downloads
      # Persist EasyOCR models so it doesn't crash on DNS timeouts
      - easyocr_models:/root/.EasyOCR/model
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - db

    # Uncomment this block below to run on NVIDIA GPUs natively (60+ FPS):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [ gpu ]

  web:
    build: .
    container_name: traffic_web
    command: uvicorn web_ui:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/traffic
    ports:
      - "8002:8000"
    volumes:
      - ./:/app
      - ./data/downloads:/app/downloads
    depends_on:
      - db

volumes:
  postgres_data:
  easyocr_models:
